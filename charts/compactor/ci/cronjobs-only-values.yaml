# No listener: scheduled rollups only.
config:
  s3:
    bucket: events
    if-match: false
listen:
  enabled: false
cronJobs:
  resources:
    limits:
      memory: 256Mi
  hourly:
    enabled: true
    args: ["--day=2026-10-01"]
  promoteMonth:
    resources:
      limits:
        memory: 2Gi
  ttlSecondsAfterFinished: 86400
