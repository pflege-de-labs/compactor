# Everything sensitive comes from Secrets and a ConfigMap managed out of band.
existingConfig: compactor-managed-config
credentials:
  existingSecret: compactor-s3
ageIdentity:
  existingSecret: compactor-age
sourceAesCtrGzipKey:
  existingSecret: compactor-source-key
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/compactor
otel:
  endpoint: http://alloy.monitoring.svc:4318
  protocol: http/protobuf
extraEnv:
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: deployment.environment=test
cronJobs:
  hourly:
    enabled: true
