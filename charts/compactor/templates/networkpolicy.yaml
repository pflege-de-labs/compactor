{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "compactor.fullname" . }}
  labels:
    {{- include "compactor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "compactor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules: the only inbound traffic is the kubelet's probes.
  egress:
    {{- if .Values.networkPolicy.allowDNS }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
