name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The jobs are shared with the other pflege-de-labs repositories (ADR 0011).
jobs:
  guard:
    uses: pflege-de-labs/github-workflows/.github/workflows/release-guard.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0

  # The release rebuilds its artifacts, so the tagged commit is gated here rather than by main's last CI run.
  verify:
    needs: guard
    uses: pflege-de-labs/github-workflows/.github/workflows/go-checks.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    with:
      generate-command: go generate ./...
      generate-diff-args: "-I '^\\.TH ' -- docs/man docs/completions"

  image:
    needs: verify
    uses: pflege-de-labs/github-workflows/.github/workflows/image-release.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      version-check: true

  secobserve:
    needs: image
    uses: pflege-de-labs/github-workflows/.github/workflows/secobserve-image.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      tag: ${{ github.ref_name }}
    secrets:
      SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}

  # needs: image, so the GitHub release people see is not created until the image it documents is published and verified.
  binaries:
    needs: image
    uses: pflege-de-labs/github-workflows/.github/workflows/go-binaries.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: write
      id-token: write
    with:
      name: compactor
      package: ./cmd/compactor
