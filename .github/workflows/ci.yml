name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a branch with no open PR get an image.
  workflow_dispatch:

# Superseded PR runs are cancelled; main pushes are not, because each commit must produce its own image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Run directly rather than via upstream's upload_sbom action, whose entrypoint cannot report failure (ADR 0009).
  SCANNER_IMAGE: ghcr.io/secobserve/secobserve-scanners:2026_08@sha256:7dd952f02a9a8262b61399bb65abdeea9c8b5b8628aa4788ba7d411d198931ab

jobs:
  checks:
    uses: ./.github/workflows/go-checks.yml
    permissions:
      contents: read

  # needs: checks, so no image ever exists for a commit whose checks failed.
  image:
    name: Image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fork PRs get no registry credentials or OIDC token, so they build only and are not signed.
      - name: Decide whether the image can be pushed
        id: push
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # On pull_request HEAD is a merge commit that exists in no one's clone, so tag the head commit instead.
      - name: Resolve the commit being built
        id: commit
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          # :latest belongs to releases only (ADR 0009).
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.commit.outputs.short_sha }}
            type=ref,event=branch
            type=ref,event=pr

      # provenance: false avoids an extra "unknown/unknown" manifest on GHCR; releases carry full provenance (ADR 0009).
      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.enabled == 'true' }}
          build-args: |
            VERSION=${{ steps.commit.outputs.short_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.push.outputs.enabled == 'true'

      # Keyless (OIDC identity of this workflow); signing by digest covers every tag. Fork builds export nothing, so are skipped.
      - name: Sign the image
        if: steps.push.outputs.enabled == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # SecObserve upload and scan skip PR builds entirely, so a transient PR branch leaves no trace in the findings tool.
      - name: Extract the image's SBOM attestations to files
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .SBOM }}' > sbom-raw.json
          for platform in linux/amd64 linux/arm64; do
            out="sbom-$(echo "$platform" | tr '/' '-').json"
            jq --arg p "$platform" '.[$p].SPDX' sbom-raw.json > "$out"
            if ! jq -e 'has("SPDXID") and has("spdxVersion")' "$out" > /dev/null; then
              echo "::error::${out} is not a bare SPDX document"
              exit 1
            fi
          done

      # One upload per platform: SecObserve keys a vulnerability check on the file name, so both land.
      - name: Upload the SBOMs to SecObserve
        id: sbom_upload
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SO_API_BASE_URL: https://webhooks.management.p4e.io/secobserve
          SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}
          SO_PRODUCT_NAME: compactor
          SO_BRANCH_NAME: ${{ github.ref_name }}
          SO_ORIGIN_SERVICE: compactor
        run: |
          for sbom in sbom-linux-*.json; do
            docker run --rm -v "${PWD}:/workspace" -w /workspace \
              -e SO_API_BASE_URL -e SO_API_TOKEN -e SO_PRODUCT_NAME \
              -e SO_BRANCH_NAME -e SO_ORIGIN_SERVICE -e SO_FILE_NAME="$sbom" \
              --entrypoint /entrypoints/entrypoint_upload_sbom.sh \
              "$SCANNER_IMAGE"
          done

      # Scans the exact digest just signed, not a tag that could move under it.
      - name: Scan the image with Trivy and upload results to SecObserve
        id: trivy_scan
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: SecObserve/secobserve_actions_templates/actions/SCA/trivy_image@0a0f7d0981982a589f2a11c3f05c8e1c628fbd79 # v2026_08
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        with:
          target: ${{ env.IMAGE }}@${{ env.DIGEST }}
          report_name: trivy-image-report.cdx.json
          so_api_base_url: https://webhooks.management.p4e.io/secobserve
          so_api_token: ${{ secrets.SO_API_TOKEN }}
          so_product_name: compactor
          so_branch_name: ${{ github.ref_name }}
          so_origin_service: compactor
          so_origin_docker_image_name_tag: ${{ env.IMAGE }}:${{ steps.commit.outputs.short_sha }}

      # SecObserve is a findings tool, not a build gate: an outage there must not fail an image that already built and signed.
      - name: Report the SecObserve upload outcome
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          SBOM_OUTCOME: ${{ steps.sbom_upload.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy_scan.outcome }}
        run: |
          failed=""
          if [ "$SBOM_OUTCOME" = "failure" ]; then failed="${failed} SBOM"; fi
          if [ "$TRIVY_OUTCOME" = "failure" ]; then failed="${failed} Trivy"; fi
          if [ -z "$failed" ]; then exit 0; fi
          echo "::warning::SecObserve upload failed for:${failed} - see the step logs"
          {
            echo "> [!WARNING]"
            echo "> SecObserve upload failed for:${failed}"
          } >> "$GITHUB_STEP_SUMMARY"
