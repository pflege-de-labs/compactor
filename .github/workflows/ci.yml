name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets a branch with no open PR get an image.
  workflow_dispatch:

# Superseded PR runs are cancelled; main pushes are not, because each commit must produce its own image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The jobs are shared with the other pflege-de-labs repositories (ADR 0011).
jobs:
  checks:
    uses: pflege-de-labs/github-workflows/.github/workflows/go-checks.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    with:
      generate-command: go generate ./...
      # The man page's .TH line embeds the generation date and would fail this daily.
      generate-diff-args: "-I '^\\.TH ' -- docs/man docs/completions"

  chart:
    uses: pflege-de-labs/github-workflows/.github/workflows/helm-lint.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    with:
      chart: charts/compactor
      assert-command: scripts/check-chart-render.sh charts/compactor

  # needs: checks, so no image ever exists for a commit whose checks failed.
  image:
    needs: checks
    uses: pflege-de-labs/github-workflows/.github/workflows/image-build.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: write
      id-token: write

  # PR builds leave no trace in the findings tool.
  secobserve:
    needs: image
    if: github.event_name != 'pull_request'
    uses: pflege-de-labs/github-workflows/.github/workflows/secobserve-image.yml@d5b9ce5cc098cf3239e796f49d742a48140130c0 # v1.0.0
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      tag: ${{ needs.image.outputs.short-sha }}
    secrets:
      SO_API_TOKEN: ${{ secrets.SO_API_TOKEN }}
