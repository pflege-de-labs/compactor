name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Report what would change without opening pull requests
        type: boolean
        default: false
      logLevel:
        description: Renovate log level
        type: choice
        default: info
        options: [info, debug]

permissions:
  contents: read

# Two Renovate runs against one repository would fight over the same branches.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # RENOVATE_TOKEN, not GITHUB_TOKEN: PRs opened with the workflow token do not trigger CI, and automerge waits on it.
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
